:root{--bg:#eceef2;--panel:#fff;--ink:#1b2230;--sub:#8a91a0;--line:#e6e9ef;--acc:#4a6fb0;--rng:#c9ced8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;color:var(--ink)}
.card{width:1080px;height:1920px;padding:60px;display:flex;flex-direction:column;gap:24px;background:var(--bg);overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;font-size:26px;color:var(--sub)}
.brand{font-size:30px;color:var(--ink);letter-spacing:10px;font-weight:600}
h1{font-size:76px;font-weight:500;line-height:1.05}
.panel{background:var(--panel);border-radius:20px;padding:28px 32px}
.pt{font-size:24px;color:var(--sub);margin-bottom:10px}
.big{display:flex;align-items:baseline;gap:22px}
.big .s{font-size:100px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big .r{font-size:40px;color:var(--acc);font-weight:600}
.big .q{font-size:26px;color:var(--sub);margin-left:auto}
.foot{margin-top:auto;font-size:19px;color:var(--sub);display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:3px 6px;border-bottom:1px solid var(--line);font-size:26px;vertical-align:middle}
td.n{text-align:right;white-space:nowrap}
.heat td{text-align:center;font-size:24px;padding:13px 4px;border:none}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 14px}
.tile{background:#f6f7fa;border-radius:14px;padding:10px 12px;min-width:0}
.tk{font-size:19px;color:var(--sub)}
.tv{display:flex;align-items:center;gap:10px;margin-top:6px}
.tv span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv b{font-size:30px;font-variant-numeric:tabular-nums}
.tg{font-size:15px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.heat th{font-size:22px;color:var(--sub);font-weight:400;padding:6px 2px}
.heat td.m{text-align:left;font-size:25px;white-space:nowrap}
</style></head><body><div class="card">

<div class="foot"><span>灰线：裁判最低 → 最高 · 点：去极值均分</span><span>文笔坐标 2026.10.17</span></div></div><script>(function () {
  // 仅在 ?anim 时启用：静态导出保持最终画面
  if (!location.search.includes('anim')) return;
  const A = [];
  const ease = 'cubic-bezier(.2,.7,.2,1)';
  const add = (el, kf, delay, dur) => {
    const a = el.animate(kf, { delay, duration: dur, fill: 'both', easing: ease });
    a.pause();
    A.push(a);
  };
  const fadeUp = [{ opacity: 0, transform: 'translateY(28px)' }, { opacity: 1, transform: 'none' }];
  const pop = [{ opacity: 0, transform: 'scale(0)' }, { opacity: 1, transform: 'scale(1)' }];
  const card = document.querySelector('.card');
  [...card.children].forEach((el, i) => {
    const base = i < 2 ? i * 120 : 260 + (i - 2) * 380;
    add(el, fadeUp, base, 560);
    if (!el.classList.contains('panel')) return;
    el.querySelectorAll('table:not(.heat) tr').forEach((tr, j) =>
      add(tr, [{ opacity: 0, transform: 'translateX(-26px)' }, { opacity: 1, transform: 'none' }], base + 140 + j * 45, 440));
    el.querySelectorAll('.heat tr').forEach((tr, r) =>
      [...tr.children].forEach((td, c) =>
        add(td, [{ opacity: 0, transform: 'scale(.55)' }, { opacity: 1, transform: 'none' }], base + 120 + (r + c) * 26, 380)));
    el.querySelectorAll('.rd').forEach((d, j) => add(d, pop, base + 260 + j * 45, 420));
    el.querySelectorAll('.rl').forEach((ln, j) =>
      add(ln, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], base + 380 + j * 45, 650));
    el.querySelectorAll('.rlab').forEach((t, j) => add(t, [{ opacity: 0 }, { opacity: 1 }], base + 80 + j * 35, 380));
    el.querySelectorAll('.rp').forEach((p, j) => add(p, pop, base + 420 + j * 420, 950));
    el.querySelectorAll('.tile').forEach((t, j) =>
      add(t, [{ opacity: 0, transform: 'translateY(18px) scale(.95)' }, { opacity: 1, transform: 'none' }], base + 140 + j * 50, 440));
    el.querySelectorAll('.sp').forEach((p, j) =>
      add(p, [{ opacity: 0, transform: 'translateY(-16px)' }, { opacity: 1, transform: 'none' }], base + 180 + j * 11, 360));
  });
  const cnt = [...document.querySelectorAll('.cnt')].map(e => ({
    e, v: parseFloat(e.textContent), d: (e.textContent.split('.')[1] || '').length,
    t0: (() => { let p = e; while (p && !p.parentElement?.classList.contains('card')) p = p.parentElement; return p ? [...card.children].indexOf(p) : 2; })(),
  }));
  let end = 0;
  A.forEach(a => { const t = a.effect.getTiming(); end = Math.max(end, t.delay + t.duration); });
  window.__dur = end;
  window.__seek = ms => {
    A.forEach(a => (a.currentTime = ms));
    cnt.forEach(c => {
      const start = 260 + (c.t0 - 2) * 380 + 200;
      const p = Math.min(1, Math.max(0, (ms - start) / 1300));
      c.e.textContent = (c.v * (1 - Math.pow(1 - p, 3))).toFixed(c.d);
    });
  };
  window.__seek(0);
})();
