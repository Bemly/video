<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>朱宫体素幻境 - Vermilion Voxel Realm</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: "Microsoft YaHei", sans-serif;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>朱宫体素幻境</h1>
        <p>中式古典建筑群 - 体素风格 (Three.js)</p>
    </div>

    <!-- 引入 Three.js 和 OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 全局变量 ---
        let scene, camera, renderer, controls;
        const voxels = [];

        // --- 配置参数 ---
        const COLORS = {
            wall: 0xA52A2A,       // 朱红墙
            roof: 0xFFD700,        // 金色琉璃瓦
            wood: 0x8B4513,        // 木色柱子/梁
            ground: 0x7CFC00,      // 草地绿色
            path: 0xD3D3D3,        // 石板路灰色
            accent: 0xFFFFFF       // 白色点缀/灯笼
        };

        init();
        animate();

        function init() {
            // 场景初始化
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e); // 深蓝色黄昏背景
            scene.fog = new THREE.Fog(0x1a1a2e, 50, 150);

            // 相机
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(40, 30, 60);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 控制器
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 5, 0);

            // 灯光
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xff9933, 2); // 黄昏光
            sunLight.position.set(50, 50, 20);
            sunLight.castShadow = true;
            // 优化阴影性能
            sunLight.shadow.mapSize.width = 1024;
            sunLight.shadow.mapSize.height = 1024;
            scene.add(sunLight);

            // 地面创建
            createGround();

            // 建筑群构建
            // 1. 山门 (Gate) - 前方
            buildMountainGate(0, 0, 40);

            // 2. 配殿 (Side Halls) - 对称分布
            buildSideHall(-18, 0, 10);
            buildSideHall(18, 0, 10);

            // 3. 主殿 (Main Hall) - 中心核心
            buildMainHall(0, 0, -15);

            // 4. 宝塔 (Pagoda) - 右侧
            buildPagoda(25, 0, -10);

            // 窗口大小变化处理
            window.addEventListener('resize', onWindowResize, false);
        }

        // --- 构建核心逻辑 ---

        function createVoxel(x, y, z, color) {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: color });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            cube.castShadow = true;
            cube.receiveShadow = true;
            scene.add(cube);
        }

        function createGround() {
            // 草地基底
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ color: COLORS.ground });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 铺设中轴路面
            for (let z = -50; z < 60; z += 2) {
                for (let x = -5; x <= 5; x += 2) {
                    createVoxel(x, 0.5, z, COLORS.path);
                }
            }
        }

        // 构建通用建筑模块：屋顶 (飞檐效果)
        function drawRoof(centerX, centerY, centerZ, width, depth, height) {
            for (let x = -width/2; x <= width/2; x++) {
                for (let z = -depth/2; z <= depth/2; z++) {
                    // 简单的梯形/坡度算法，模拟中式屋顶
                    let roofHeight = height - Math.abs(x) * 0.3 - Math.abs(z) * 0.3;
                    if (roofHeight > 0) {
                        // 增加一点飞檐的边缘效果（稍微向外延伸）
                        const offset = (Math.abs(x) > width/2 - 1 || Math.abs(z) > depth/2 - 1) ? 0.5 : 0;
                        createVoxel(centerX + x + offset, centerY + roofHeight, centerZ + z + offset, COLORS.roof);
                    }
                }
            }
        }

        function buildMountainGate(x, y, z) {
            // 柱子与门架
            for (let h = 1; h <= 8; h++) {
                createVoxel(x - 5, h, z, COLORS.wood);
                createVoxel(x + 5, h, z, COLORS.wood);
                createVoxel(x - 5, h, z + 2, COLORS.wood);
                createVoxel(x + 5, h, z + 2, COLORS.wood);
            }
            // 横梁
            for (let i = -5; i <= 5; i++) {
                createVoxel(x + i, 8, z, COLORS.wood);
                createVoxel(x + i, 8, z + 2, COLORS.wood);
            }
            // 屋顶
            drawRoof(x, 9, z + 1, 14, 8, 5);
        }

        function buildSideHall(x, y, z) {
            // 墙体
            for (let i = -3; i <= 3; i++) {
                for (let h = 1; h <= 5; h++) {
                    createVoxel(x + i, h, z, COLORS.wall);
                }
            }
            // 前柱子
            for (let h = 1; h <= 5; h++) {
                createVoxel(x - 3, h, z + 3, COLORS.wood);
                createVoxel(x + 3, h, z + 3, COLORS.wood);
            }
            // 屋顶
            drawRoof(x, 6, z + 3, 10, 8, 4);
        }

        function buildMainHall(x, y, z) {
            // 基座台阶
            for (let i = -6; i <= 6; i++) {
                for (let j = -4; j <= 4; j++) {
                    createVoxel(x + i, 1, z + j, COLORS.path);
                }
            }
            // 主体墙面 (红墙)
            for (let i = -5; i <= 5; i++) {
                for (let h = 2; h <= 7; h++) {
                    createVoxel(x + i, h, z, COLORS.wall);
                }
            }
            // 柱子 (高大粗壮)
            for (let h = 2; h <= 7; h++) {
                createVoxel(x - 5, h, z, COLORS.wood);
                createVoxel(x + 5, h, z, COLORS.wood);
                createVoxel(x - 5, h, z + 4, COLORS.wood);
                createVoxel(x + 5, h, z + 4, COLORS.wood);
            }
            // 大门
            for (let h = 2; h <= 5; h++) {
                createVoxel(x, h, z + 4, COLORS.accent);
            }
            // 宏伟的屋顶 (歇山式示意)
            drawRoof(x, 8, z + 4, 16, 12, 6);
            // 二层小屋顶装饰
            drawRoof(x, 13.5, z + 4, 8, 6, 3);
        }

        function buildPagoda(x, y, z) {
            const layers = 4;
            for (let l = 0; l < layers; l++) {
                const currentHeight = l * 6;
                // 层级底座
                for (let i = -3; i <= 3; i++) {
                    for (let j = -3; j <= 3; j++) {
                        createVoxel(x + i, currentHeight + 1, z + j, COLORS.wood);
                    }
                }
                // 层级墙壁
                for (let h = 2; h <= 5; h++) {
                    for (let i = -3; i <= 3; i++) {
                        createVoxel(x + i, currentHeight + h, z + 3, COLORS.wall);
                    }
                }
                // 层级屋顶
                drawRoof(x, currentHeight + 6, z + 3, 10, 10, 4);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
