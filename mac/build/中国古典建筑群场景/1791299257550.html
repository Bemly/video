<meta charset="utf-8">
<!DOCTYPE html>
<html>
<head>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three/examples/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/"}}</script>

    <title>Voxel Ancient Chinese Temple</title>
    <style> body { margin: 0; background: #000; overflow: hidden; } </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 50, 150);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(60, 40, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0x404060, 1);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffa500, 1.2);
        sunLight.position.set(50, 50, 50);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const COLORS = { roof: 0x5D4037, wall: 0xB71C1C, wood: 0x8B4513, stone: 0x757F9F, grass: 0x2D5A27, path: 0xD2B48C, gold: 0xFFD700 };

        function createVoxel(x, y, z, color) {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: color });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            cube.castShadow = true;
            cube.receiveShadow = true;
            scene.add(cube);
        }

        // Build Logic
        for (let x = -60; x <= 60; x += 2) {
            for (let z = -60; z <= 60; z += 2) {
                const isPath = (Math.abs(x) < 5 || Math.abs(z) < 10);
                createVoxel(x, 0, z, isPath ? COLORS.path : COLORS.grass);
            }
        }

        // Main Hall & Roofs
        for (let x = -18; x <= 18; x += 2) {
            for (let z = 5; z <= 35; z += 2) {
                if (Math.abs(x) > Math.abs(z - 20)) createVoxel(x, 9, z, COLORS.roof);
            }
        }

        // Pagodas
        const pagodas = [[-40, -30], [40, -30]];
        pagodas.forEach(pos => {
            for (let y = 1; y <= 20; y += 1) {
                const r = (20 - y) / 4;
                for (let x = pos[0] - r; x <= pos[0] + r; x += 2) {
                    for (let z = pos[1] - r; z <= pos[1] + r; z += 2) {
                        if (Math.abs(x - pos[0]) <= r && Math.abs(z - pos[1]) <= r) {
                            createVoxel(x, y, z, y > 15 ? COLORS.gold : (y % 3 === 0 ? COLORS.roof : COLORS.stone));
                        }
                    }
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
