<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three/examples/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/"}}</script>

<meta charset="UTF-8">
<title>灵山遗产 | Voxel Chinese Architecture</title>
<style>
  body{margin:0;overflow:hidden;}
  canvas{display:block;}
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/controls/OrbitControls.js';

/* ---------- 场景、相机与渲染器 ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd1e5);

const camera = new THREE.PerspectiveCamera(
  60, window.innerWidth/window.innerHeight, 0.1, 200
);
camera.position.set(60, 80, 70);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* ---------- 控制器 ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 25, -5);
controls.update();

/* ---------- 光照 ---------- */
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
hemiLight.position.set(0,200,0); scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(-120,200,100); scene.add(dirLight);

/* ---------- 地面 ---------- */
const groundGeo = new THREE.PlaneGeometry(200,200);
const groundMat = new THREE.MeshLambertMaterial({color:0x228b22});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x=-Math.PI/2; scene.add(ground);

/* ---------- 工具函数 ---------- */
function createVoxelBuilding(w,h,d,vs=2,oy=0,color=0x8b4513){
  const group=new THREE.Group();
  const geo=new THREE.BoxGeometry(vs,vs,vs);
  const mat=new THREE.MeshLambertMaterial({color});
  const count=w*h*d;
  const inst=new THREE.InstancedMesh(geo,mat,count);
  let i=0;
  for(let z=0;z<d;z++){
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const pos=new THREE.Vector3(
          (x-w/2)*vs,
          oy+y*vs,
          (z-d/2)*vs
        );
        const m=new THREE.Matrix4().makeTranslation(pos.x,pos.y,pos.z);
        inst.setMatrixAt(i++,m);
      }
    }
  }
  group.add(inst); return group;
}

function createRoof(w,d,h=3,vs=2,color=0xaaaaaa){
  const group=new THREE.Group();
  const geo=new THREE.BoxGeometry(vs,vs,vs);
  const mat=new THREE.MeshLambertMaterial({color});
  const count=Math.floor(w*d*h);
  const inst=new THREE.InstancedMesh(geo,mat,count);
  let i=0;
  for(let y=0;y<h;y++){
    const w2=w-2*y, d2=d-2*y;
    if(w2<=0||d2<=0)break;
    for(let z=0;z<d2;z++){
      for(let x=0;x<w2;x++){
        const pos=new THREE.Vector3(
          (x-w2/2)*vs,
          y*vs+vs/2,
          (z-d2/2)*vs
        );
        const m=new THREE.Matrix4().makeTranslation(pos.x,pos.y,pos.z);
        inst.setMatrixAt(i++,m);
      }
    }
  }
  group.add(inst); return group;
}

/* ---------- 建筑 ---------- */
// 主殿
const mainHall=createVoxelBuilding(20,10,30,2,0,0xd9534f);
mainHall.position.set(0,0,0); scene.add(mainHall);
const roofMain=createRoof(20,30,3,2,0xaaaaaa);
roofMain.position.set(0,20+3,0); mainHall.add(roofMain);

// 配殿左
const sideL=createVoxelBuilding(12,8,20,2,0,0x8b4513);
sideL.position.set(-30,0,-5); scene.add(sideL);
const roofSide=createRoof(12,20,3,2,0xaaaaaa);
roofSide.position.set(0,16+3,0); sideL.add(roofSide);

// 配殿右
const sideR=createVoxelBuilding(12,8,20,2,0,0x8b4513);
sideR.position.set(30,0,-5); scene.add(sideR);
sideR.add(roofSide.clone());

// 山门
const gate=createVoxelBuilding(8,12,6,2,0,0x5d4037);
gate.position.set(0,0,-40); scene.add(gate);
const roofGate=createRoof(8,6,3,2,0xaaaaaa);
roofGate.position.set(0,24+3,0); gate.add(roofGate);

// 宝塔左
const pagodaL=createVoxelBuilding(6,18,6,2,0,0x5d4037);
pagodaL.position.set(-18,0,-40); scene.add(pagodaL);
const roofPag=createRoof(6,6,3,2,0xaaaaaa);
roofPag.position.set(0,36+3,0); pagodaL.add(roofPag);

// 宝塔右
const pagodaR=createVoxelBuilding(6,18,6,2,0,0x5d4037);
pagodaR.position.set(18,0,-40); scene.add(pagodaR);
pagodaR.add(roofPag.clone());

/* ---------- 动画 ---------- */
function animate(){requestAnimationFrame(animate); renderer.render(scene,camera);}
animate();

/* ---------- 自适应 ---------- */
window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();});
</script>
</body>
</html>
