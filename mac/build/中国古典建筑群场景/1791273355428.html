<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古代体素庭院</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a2332; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; cursor: grab; }
    #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 1.2rem; pointer-events: none; opacity: 0.8; }
  </style>
</head>
<body>
  <div id="loading">初始化体素架构...</div>

  <!-- Three.js ESM Importmap -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ================= 场景基础设置 =================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b2a3c); // 晨昏暗蓝
    scene.fog = new THREE.FogExp2(0x1b2a3c, 0.006); // 深度大气效应

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 38, 55);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.15;
    controls.autoRotate = true; // 自动环绕展示全貌
    controls.autoRotateSpeed = 0.4;

    // ================= 灯光与氛围 =================
    const ambientLight = new THREE.AmbientLight(0x4a5b6c, 1.1);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffd8b6, 1.4);
    sunLight.position.set(-28, 50, -35); // 低角 sunlight，生成长影
    scene.add(sunLight);

    const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x2a3b4c, 0.25);
    scene.add(hemiLight);

    // ================= 体素引擎核心 =================
    const GEO = new THREE.BoxGeometry(1, 1, 1);
    const voxelList = [];

    // 添加体素块辅助函数
    function addBox(x, y, z, w, h, d, color) {
      for (let i = 0; i < w; i++)
        for (let j = 0; j < h; j++)
          for (let k = 0; k < d; k++)
            voxelList.push({ x: i + x, y: j + y, z: k + z, c: color });
    }

    // 架构配色方案 (Hex)
    const C = {
      WALL: 0x9E1B26,   // 朱墙
      WOOD: 0x8C5A32,   // 木柱/结构
      ROOF: 0x4A6FA5,   // 青蓝琉璃瓦
      GROUND: 0x6B7A8F, // 石庭/道路
      STEP: 0x7A7D85,   // 阶石
      LANTERN: 0xFF6B35 // 灯笼
    };

    function buildArchitecture() {
      // 1. 地面与道路 (Y=0)
      addBox(-25, 0, -25, 50, 1, 50, C.GROUND);
      addBox(-12, 0.5, -20, 4, 0.5, 18, C.GROUND); // 中轴线道路
      addBox(12, 0.5, -20, 4, 0.5, 18, C.GROUND);

      // 2. 山门 (Z=-5)
      addBox(-2, 1, -7, 4, 3, 1, C.WALL); // 前墙
      addBox(-2, 1, -3, 4, 3, 1, C.WALL); // 后墙
      addBox(-3, 2, -7, 1, 3, 4, C.WALL); // 左墙
      addBox(2, 2, -7, 1, 3, 4, C.WALL); // 右墙
      addBox(-0.5, 1, -6, 3, 2.5, 1, C.WOOD); // 门洞
      addBox(-1.2, 2, -5, 0.8, 1, 0.8, C.LANTERN); // 门旁灯笼
      addBox(1.2, 2, -5, 0.8, 1, 0.8, C.LANTERN);

      // 3. 配殿 (Z=15, X=±8)
      for (const side of [-1, 1]) {
        const x = side * 8;
        addBox(x-2, 1.5, 13, 4, 2.5, 1, C.WALL); // 前墙
        addBox(x-2, 1.5, 17, 4, 2.5, 1, C.WALL); // 后墙
        addBox(x-3, 2, 13, 1, 2.5, 5, C.WALL); // 左墙
        addBox(x+2, 2, 13, 1, 2.5, 5, C.WALL); // 右墙
        addBox(x-2, 4.5, 15, 4, 0.8, 4, C.ROOF); // 单坡顶
        addBox(x-3, 5.2, 14, 6, 0.8, 6, C.ROOF); // 飞檐
      }

      // 4. 主殿 (Z=25, X=0)
      addBox(-4, 1.5, 23, 8, 3.5, 1, C.WALL); // 前墙
      addBox(-4, 1.5, 27, 8, 3.5, 1, C.WALL); // 后墙
      addBox(-5, 2, 23, 1, 3.5, 6, C.WALL); // 左墙
      addBox(5, 2, 23, 1, 3.5, 6, C.WALL); // 右墙
      addBox(-3, 2, 24, 1.5, 1, 6, C.WOOD); // 内柱
      addBox(3.5, 2, 24, 1.5, 1, 6, C.WOOD);
      // 歇山顶/攒尖顶复合结构 (三层飞檐)
      addBox(-3, 5.5, 24, 6, 1, 6, C.ROOF);
      addBox(-4, 6.2, 23, 8, 1, 8, C.ROOF);
      addBox(-5, 7, 22, 10, 1, 10, C.ROOF);

      // 5. 宝塔/钟鼓楼群 (Z=30~35)
      // 中央高塔
      addBox(-1, 0, 34, 2, 8, 2, C.WOOD); // 中柱
      addBox(-1.5, 8, 34, 3, 1, 3, C.ROOF);
      addBox(-2, 9, 34, 5, 1, 5, C.ROOF);
      addBox(-2.5, 10, 34, 7, 1, 7, C.ROOF);
      addBox(-3, 11, 34, 9, 1, 9, C.ROOF);
      // 侧台 (钟鼓楼)
      for (const side of [-1, 1]) {
        const x = side * 6;
        addBox(x-1, 0.5, 29, 3, 4.5, 3, C.WOOD);
        addBox(x-1.5, 5, 29, 3, 1, 3, C.ROOF);
        addBox(x-2, 5.7, 29, 5, 1, 5, C.ROOF);
        addBox(x-2.5, 6.4, 29, 7, 1, 7, C.ROOF);
      }

      // 6. 庭院细节 (草坪/石阶)
      addBox(-18, 1, 8, 6, 0.5, 4, C.STEP); // 左院
      addBox(18, 1, 8, 6, 0.5, 4, C.STEP); // 右院
      addBox(0, 1.5, -2, 4, 1, 3, C.STEP); // 主殿前台
    }

    buildArchitecture();
    document.getElementById('loading').style.opacity = '0';

    // ================= 体素渲染优化 (InstancedMesh) =================
    const colorGroups = {};
    voxelList.forEach(v => {
      if (!colorGroups[v.c]) colorGroups[v.c] = [];
      colorGroups[v.c].push(v);
    });

    const instancedMeshes = [];
    for (const [color, voxels] of Object.entries(colorGroups)) {
      const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(color), side: THREE.DoubleSide });
      const mesh = new THREE.InstancedMesh(GEO, mat, voxels.length);
      
      // 批量设置变换矩阵 (高性能)
      for (let i = 0; i < voxels.length; i++) {
        const m = new THREE.Matrix4();
        m.makeTranslation(voxels[i].x, voxels[i].y, voxels[i].z);
        mesh.setMatrixAt(i, m);
      }
      
      scene.add(mesh);
      instancedMeshes.push(mesh);
    }

    // ================= 渲染循环 =================
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 窗口自适应
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // 交互提示
    controls.addEventListener('start', () => { controls.autoRotate = false; });
    controls.addEventListener('end', () => { setTimeout(() => controls.autoRotate = true, 2000); });
  </script>
</body>
</html>
