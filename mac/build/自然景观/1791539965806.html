<meta charset="utf-8">
<!DOCTYPE html>
<html>
<head>
    <title>穿云瀑布</title>
    <style>
        body { margin:0; }
        canvas { display:block; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/build/three.min.js"></script>
    <script type="text/javascript">
// voxel.js - 地形体素类
class VoxelTerrain extends THREE.Group {
    constructor() {
        super();
        
        // 生成地形网格
        const geometry = new THREE.BufferGeometry();
        const positions = [];
        for(let z=-20; z<20; z++) {
            for(let x=-20; x<20; x++) {
                positions.push(x, Math.sin(x + Date.now()/1000) * 3 + z*0.5, z);
            }
        }
        
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        
        
        // 创建材质与网格
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x8b4513,
            roughness: 0.7,
            metalness: 0.9 
        });
        
        const mesh = new THREE.Mesh(geometry, material);
        this.add(mesh);
    }
    
    updateLighting() {
        this.children[0].material.color.offsetHSL(0.1, 0, -0.02);
    }
}

// waterfall.js - 瀑布效果类
function createWaterfallEffect() {
    const canvas = document.createElement('canvas');
    canvas.width = 4;
    canvas.height = 4;
    
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,255,255,0.3)';
    ctx.fillRect(0,0,4,4);
    
    const texture = new THREE.CanvasTexture(canvas);
    
    // 创建蒙德里安平面
    const geometry = new THREE.PlaneGeometry(160, 80, 40, 80);
    const material = new THREE.MeshPhongMaterial({ map: texture });
    material.blending = THREE.AdditiveBlending;
    
    const waterfall = new THREE.Mesh(geometry, material);
    return waterfall;
}

</script>
    
    
    <script>
        // 初始化场景
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 20, -40);
        
        // 创建地形
        const terrain = new VoxelTerrain();
        scene.add(terrain);

        // 添加瀑布效果
        const waterfall = createWaterfallEffect();
        scene.add(waterfall);

        // 穿云雾气效果
        addClouds();

        // 光源配置
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffa500, 1);
        directionalLight.position.set(30, 40, -30);
        scene.add(directionalLight);

        // 渲染设置
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 动态效果循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新地形光照
            terrain.updateLighting();
            
            // 瀑布动态效果
            waterfall.tick();

            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
