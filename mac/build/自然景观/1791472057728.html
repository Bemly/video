<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Nature World - Dawn</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Voxel Nature: Dawn Landscape (Auto-Rotating)</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.136.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.136.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        class VoxelWorld {
            constructor(scene) {
                this.scene = scene;
                this.size = 64;
                
                this.materials = {
                    grass: new THREE.MeshStandardMaterial({ color: 0x4a7c44 }),
                    mountain: new THREE.MeshStandardMaterial({ color: 0x7a7a7a }),
                    water: new THREE.MeshStandardMaterial({ color: 0x4488ff, transparent: true, opacity: 0.7 }),
                    cloud: new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 }),
                    waterfall: new THREE.MeshStandardMaterial({ color: 0xadd8e6 })
                };

                this.initWorld();
            }

            getHeight(x, z) {
                const freq = 0.05;
                const amp = 15;
                let h = Math.sin(x * freq) * Math.cos(z * freq) * amp;
                h += Math.sin(x * freq * 2) * Math.cos(z * freq * 2) * (amp / 2);
                
                const distToCenter = Math.sqrt(Math.pow(x - 32, 2) + Math.pow(z - 32, 2));
                if (distToCenter < 10) {
                    h -= (10 - distToCenter) * 2;
                }
                
                return Math.floor(h + 20);
            }

            initWorld() {
                const boxGeo = new THREE.BoxGeometry(1, 1, 1);
                
                const terrain = new THREE.InstancedMesh(boxGeo, this.materials.grass, 10000);
                const mountain = new THREE.InstancedMesh(boxGeo, this.materials.mountain, 5000);
                const waterfall = new THREE.InstancedMesh(boxGeo, this.materials.waterfall, 1000);
                const clouds = new THREE.InstancedMesh(boxGeo, this.materials.cloud, 500);

                let tIdx = 0;
                let mIdx = 0;
                let wIdx = 0;
                let cIdx = 0;
                const matrix = new THREE.Matrix4();

                for (let x = 0; x < this.size; x++) {
                    for (let z = 0; z < this.size; z++) {
                        const h = this.getHeight(x, z);
                        for (let y = 0; y < h; y++) {
                            matrix.setPosition(x, y, z);
                            
                            if (y === h - 1) {
                                if (h > 25) {
                                    mountain.setMatrixAt(mIdx++, matrix);
                                } else {
                                    terrain.setMatrixAt(tIdx++, matrix);
                                }
                            } else {
                                terrain.setMatrixAt(tIdx++, matrix);
                            }
                        }
                    }
                }

                // Waterfall
                for (let y = 25; y > 10; y--) {
                    for (let x = 31; x >= 31; x--) {
                        matrix.setPosition(x, y, 32);
                        waterfall.setMatrixAt(wIdx++, matrix);
                    }
                }

                // Clouds
                for (let i = 0; i < 500; i++) {
                    matrix.setPosition(
                        Math.random() * 100 - 50,
                        Math.random() * 40 + 30,
                        Math.random() * 100 - 50
                    );
                    matrix.scale(new THREE.Vector3(Math.random() * 4 + 2, 1, Math.random() * 3 + 2));
                    clouds.setMatrixAt(cIdx++, matrix);
                }

                this.scene.add(terrain);
                this.scene.add(mountain);
                this.scene.add(waterfall);
                this.scene.add(clouds);
            }
        }

        const scene = new THREE.Scene();
        const skyColor = new THREE.Color(0xffa581);
        scene.background = skyColor;
        scene.fog = new THREE.FogExp2(skyColor, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(60, 60, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffccaa, 1.2);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        const world = new VoxelWorld(scene);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
