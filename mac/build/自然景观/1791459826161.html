<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxal_Twilight_Valley - Three.js Voxel Scene</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Voxal_Twilight_Valley <br><small>Auto-rotating view | InstancedMesh Optimized</small></div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 全局变量 ---
        let scene, camera, renderer, controls;
        const voxels = []; // 存储逻辑数据用于生成
        const instanceMeshes = {}; // 存放不同材质的 InstancedMesh

        // --- 配置参数 ---
        const WORLD_SIZE = 60; // 地图范围
        const VOXEL_SIZE = 1;
        const COLORS = {
            grass: new THREE.Color(0x3a5a40),
            mountain: new THREE.Color(0x708090),
            water: new THREE.Color(0x0077be),
            snow: new THREE.Color(0xffffff),
            tree: new THREE.Color(0x2d6a4f),
            cloud: new THREE.Color(0xffffff)
        };

        init();
        animate();

        function init() {
            // 1. 场景基础设置
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.015);

            // 2. 相机设置
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(50, 40, 80);

            // 3. 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 4. 控制器
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            // 5. 灯光 (晨昏色调)
            const ambientLight = new THREE.AmbientLight(0x404070, 1); // 深蓝调环境光
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffaa33, 2); // 橙色夕阳
            sunLight.position.set(50, 100, -50);
            sunLight.castShadow = true;
            scene.add(sunLight);

            const rimLight = new THREE.PointLight(0xff00ff, 1); // 紫色边缘光
            rimLight.position.set(-30, 20, -30);
            scene.add(rimLight);

            // 6. 生成地貌数据
            generateWorld();

            // 7. 渲染体素 (使用 InstancedMesh 以保证流畅)
            renderInstancedMeshes();

            window.addEventListener('resize', onWindowResize);
        }

        function generateWorld() {
            // 简单的噪声函数模拟地形高度
            for (let x = -WORLD_SIZE / 2; x < WORLD_SIZE / 2; x++) {
                for (let z = -WORLD_SIZE / 2; z < WORLD_SIZE / 2; z++) {
                    // 高度公式：正弦波叠加模拟山脉
                    let h = Math.sin(x * 0.1) * 5 + Math.cos(z * 0.1) * 5;
                    h += Math.sin(x * 0.2 + z * 0.2) * 3;
                    h += Math.sin(x * 0.05) * 10; // 主山脉
                    
                    let height = Math.floor(h);

                    // 山脉判定
                    if (height > 12) {
                        voxels.push({ x, z, y: height, type: 'mountain' });
                        // 雪山顶端
                        if (height > 18) voxels.push({ x, z, y: height + 1, type: 'snow' });
                    } else if (height > 3) {
                        voxels.push({ x, z, y: height, type: 'grass' });
                        // 随机植被
                        if (Math.random() > 0.97) voxels.push({ x, z, y: height + 1, type: 'tree' });
                    } else {
                        // 水体
                        voxels.push({ x, z, y: height, type: 'water' });
                    }

                    // 瀑布逻辑：如果高度突变且在特定坐标
                    if (x === 0 && z > -10 && z < 10 && height > 5) {
                        voxels.push({ x, z, y: Math.floor(Math.random() * 5) + 6, type: 'water' });
                    }
                }
            }

            // 生成云朵
            for (let i = 0; i < 20; i++) {
                let cx = (Math.random() - 0.5) * 100;
                let cz = (Math.random() - 0.5) * 100;
                let cy = 20 + Math.random() * 15;
                for (let dx = 0; dx < 3; dx++) {
                    for (let dy = 0; dy < 2; dy++) {
                        for (let dz = 0; dz < 3; dz++) {
                            voxels.push({ 
                                x: cx + dx, y: cy + dy, z: cz + dz, 
                                type: 'cloud', 
                                cloudId: i 
                            });
                        }
                    }
                }
            }
        }

        function renderInstancedMeshes() {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            
            // 按类型分组处理
            const groups = {};
            voxels.forEach(v => {
                if (!groups[v.type]) groups[v.type] = [];
                groups[v.type].push(v);
            });

            Object.keys(groups).forEach(type => {
                const data = groups[type];
                const count = data.length;
                const material = new THREE.MeshStandardMaterial({ 
                    color: COLORS[type],
                    roughness: 0.8,
                    metalness: 0.2
                });

                // 如果是云，增加透明度
                if (type === 'cloud') {
                    material.transparent = true;
                    material.opacity = 0.7;
                }

                const mesh = new THREE.InstancedMesh(geometry, material, count);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                const dummy = new THREE.Object3D();
                data.forEach((v, i) => {
                    dummy.position.set(v.x, v.y, v.z);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(i, dummy.matrix);
                });

                scene.add(mesh);
                instanceMeshes[type] = mesh; // 记录用于后续动画
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // 动画：让云朵缓慢漂移（由于是InstancedMesh，这里简化为整体移动或简单的颜色脉冲）
            // 为了极致流畅且简单，我们给场景一个淡淡的氛围变化
            const time = Date.now() * 0.001;
            scene.background.setHSL(0.65, 0.5, 0.05 + Math.sin(time * 0.2) * 0.02);

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
