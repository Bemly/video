<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiggyBike Animation</title>
    <style>
        body { margin: 0; }
        svg { width: 80%; height: auto; display: block; overflow-x: hidden; }
        .bike, .pigeon { transform-origin: 50% 100%; }
    </style>
</head>
<body>
<svg width="48" height="48">
    <path d="M12 5.2c-3.7 0 -7 3.4 -7 7s3.2 7 7 7 7-3.6 7-7z" fill="#3b0f45"/>

    <path d="M30,-2.5c-1 0 -7 2.4 -7 6s3.8 5.6 7 6z" fill="#fff"/>

    <path d="M18 45s-3.2 7 6 7c7,0 15.4 -7.8 23.7 16" fill="#0f159c"/>
    <path d="M37 45s-3.2 7 -6 7c0,8.1 7.4 5.3 14.9 -4" fill="#0f159c"/>

    <circle cx="26" cy="34" r="6.5" fill="#0f159c"/>

    <circle cx="28.7" cy="34" r="6.5" fill="#0f159c"/>
    <circle cx="28.7" cy="34" r="6.5" fill="#0f159c"/>
    <circle cx="28.7" cy="34" r="6.5" fill="#0f159c"/>

    <path d="M28,-3.7-3.6 0t-5.4 2.9l-1,1s7,-3.6 7,-8c0 -4.8,-2.9-10-8-15" fill="#fff"/>
    <path d="M26.1,-3.7-7.4 5t6,9l0 0c8,12 13.7,25 14.9 36" fill="#fff"/>

    <path d="M12,-0.5c4.7 0 9 -3.8 9-9s-12 -5.4 -12 6" fill="#fff"/>
    <path d="M30,-1.5c2 0 -9 6.4 -9 12s-13 5 -14.8 17" fill="#fff"/>

    <circle cx="29" cy="-0.45" r="3" fill="#fff"/>

    <path d="M17.5,39l-2 0v6h2c8 4 -5.7 15 9 13s-6 0,4 -8l0-5v2.7c9,-3.1 26,4 28,4s-9 -0.5 -7 -5l15v3c2 0 4,6 9.8,6s7 -10 5.3 -11" fill="#fff"/>

    <path d="M21,46c-5.7 0 -13,5.9 -12.8,14s-5,-6.7 -7 0t-3.2,2l14v15z" fill="#fff"/>
    <path d="M26.7,39c-5.8 0 -14,3.8 -9.7,8s2,6.6 3 10" fill="#fff"/>

</svg>

<script>
    const canvas = document.querySelector('svg');

    // 鳥のアニメーション
    function flyPigeon() {
        const currentPos = canvas.offsetLeft;
        const increment = Math.random();
        if (currentPos < 10) {
            canvas.offsetLeft += increment * 15;
        } else if (currentPos < 20) {
            canvas.offsetLeft += increment * 15;
        } else if (currentPos < 30) {
            canvas.offsetLeft += increment * 15;
        } else if (currentPos < 40) {
            canvas.offsetLeft += increment * 15;
        } else if (currentPos < 48) {
            canvas.offsetLeft += increment * 15;
        }
    }

    setInterval(flyPigeon, 20);

    // 馬のアニメーション
    function gallopBike() {
        const currentPos = canvas.offsetLeft;
        const increment = Math.random();
        if (currentPos < 10) {
            canvas.offsetLeft += increment * 2;
        } else if (currentPos < 16) {
            canvas.offsetLeft += increment * 5;
        } else if (currentPos < 22) {
            canvas.offsetLeft += increment * 3;
        } else if (currentPos < 28) {
            canvas.offsetLeft += increment * 5;
        } else if (currentPos < 34) {
            canvas.offsetLeft += increment * 2;
        } else if (currentPos < 40) {
            canvas.offsetLeft += increment * 7;
        } else if (currentPos < 48) {
            canvas.offsetLeft += increment * 5;
        }
    }

    setInterval(gallopBike, 30);

</script>
</body>
</html>
