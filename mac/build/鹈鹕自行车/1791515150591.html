<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车动画</title>

<style>
  /* 整体容器 */
  body { margin:0; background:#e6f2ff; display:flex; justify-content:center; align-items:center; height:100vh; }
  svg { border:1px solid #aaa; background:#fff; }

  /* 场景整体水平移动 */
  @keyframes slide {
    from { transform: translateX(-120%); }
    to   { transform: translateX(120%);  }
  }

  #scene {
    animation: slide 12s linear infinite;
  }

  /* 前后轮旋转 */
  @keyframes rotate {
    from { transform:rotate(0deg); }
    to   { transform:rotate(360deg); }
  }

  .wheel {
    animation: rotate 1.5s linear infinite;
    transform-origin:center center;   /* 以圆心为旋转中心 */
  }

  /* 鹈鹕翅膀摆动 */
  @keyframes flap {
    0%,100% { transform:rotate(-12deg); }
    50%     { transform:rotate(12deg);  }
  }

  .wing {
    animation: flap 0.8s ease-in-out infinite;
    transform-origin:center bottom;   /* 翅膀根部为旋转点 */
  }
</style>
</head>

<body>
<svg width="800" height="400" viewBox="0 0 800 400">
  <!-- 场景整体 -->
  <g id="scene">

    <!-- 自行车 -->
    <g id="bike">
      <!-- 前轮 -->
      <circle class="wheel" cx="200" cy="300" r="40" fill="#555" stroke="#333" stroke-width="3"/>
      <!-- 后轮 -->
      <circle class="wheel" cx="80" cy="300" r="40" fill="#555" stroke="#333" stroke-width="3"/>
      <!-- 车架 -->
      <path d="
        M80,300
        L200,300          /* 轮轴连线 */
        L170,250          /* 车把位置 */
        M200,300
        L170,260          /* 底座到车把的弧线 */
      " stroke="#333" stroke-width="4" fill="none"/>
      <!-- 车把 -->
      <line x1="170" y1="250" x2="190" y2="230" stroke="#333" stroke-width="4"/>
      <!-- 车座 -->
      <rect x="165" y="260" width="8" height="20" fill="#333"/>
    </g>

    <!-- 鹈鹕 -->
    <g id="pelican" transform="translate(80, 210)">
      <!-- 身体 -->
      <ellipse cx="60" cy="50" rx="40" ry="20" fill="#6aa84f"/>
      <!-- 头 -->
      <circle cx="100" cy="30" r="15" fill="#6aa84f"/>
      <!-- 嘴 -->
      <polygon points="115,30 140,20 140,40" fill="#ffcc00"/>
      <!-- 翅膀左 -->
      <polygon class="wing" points="40,20 60,10 70,30" fill="#6aa84f"/>
      <!-- 翅膀右 -->
      <polygon class="wing" points="120,20 100,10 90,30" fill="#6aa84f"/>
      <!-- 喙部细节 -->
      <line x1="140" y1="20" x2="150" y2="15" stroke="#ffcc00" stroke-width="2"/>
      <line x1="140" y1="40" x2="150" y2="45" stroke="#ffcc00" stroke-width="2"/>
    </g>

  </g>
</svg>
</body>
</html>
