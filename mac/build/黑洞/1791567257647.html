<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Abyss: The Black Hole Experience</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            width: 100vw;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        #title {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .info-panel {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 14px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-right: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #555;
        }

        .slider-container {
            margin-top: 10px;
        }

        label {
            display: inline-block;
            width: 120px;
            font-size: 14px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 200px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid #444;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 200;
        }

        @font-face {
            font-family: 'Orbitron';
            src: url('data:font/woff;base64,') format('woff');
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <div id="title">Cosmic Abyss: The Black Hole Experience</div>
        <div class="info-panel">
            <p>Mass: 10<sup>36</sup> kg (Supermassive)</p>
            <p>Distance from Earth: 26,000 light-years</p>
            <p>Event Horizon Diameter: ~4.5 million km</p>
        </div>
    </div>

    <div id="controls">
        <button id="reset-view">Reset View</button>
        <div class="slider-container">
            <label for="exposure">Exposure:</label>
            <input type="range" id="exposure" min="0.1" max="2" step="0.1" value="1">
        </div>
        <div class="slider-container">
            <label for="turbulence">Turbulence:</label>
            <input type="range" id="turbulence" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <div class="loading">Loading cosmic simulation...</div>
