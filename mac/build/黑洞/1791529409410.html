<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Black Hole Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'JetBrains Mono', monospace;
        }
        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #e2e8f0;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(236, 245, 255, 0.8);
            z-index: 10;
        }
        .stats {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #a0aec0;
            font-size: 0.9rem;
            text-shadow: 0 0 5px rgba(160, 174, 192, 0.5);
            z-index: 10;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #e2e8f0;
            font-size: 0.8rem;
            text-shadow: 0 0 5px rgba(236, 245, 255, 0.5);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="header">Quantum Black Hole Simulation</div>
    <div class="stats">FPS: <span id="fps">0</span></div>
    <div class="info">Use WASD to move, QE to orbit, and Scroll wheel to zoom</div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);
        camera.lookAt(0, 0, 0);
        
        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Controls setup
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.25;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x3a445d, 1);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xd5e6ff, 2);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);
        
        // Particle backgrounds
        const particleSystem = new THREE.Points(
            new THREE.BufferGeometry(),
            new THREE.PointsMaterial({
                color: 0x3a445d,
                size: 0.1,
                transparent: true,
                opacity: 0.8
            })
        );
        scene.add(particleSystem);
        
        // Add star fields
        const stars = new THREE.BufferGeometry();
        const vertices = [];
        for (let i = 0; i < 10000; i++) {
            const x = (Math.random() - 0.5) * 20;
            const y = (Math.random() - 0.5) * 20;
            const z = (Math.random() - 0.5) * 20;
            vertices.push(x, y, z);
        }
        stars.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const starMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.05,
            transparent: true,
            opacity: 0.7
        });
        const starSystem = new THREE.Points(stars, starMaterial);
        scene.add(starSystem);
        
        // Create accretion disk particles
        const accretionDisk = new THREE.BufferGeometry();
        const particlesData = [];
        for (let i = 0; i < 10000; i++) {
            const angle = Math.random() * Math.PI * 2;
            const distance = 3 + Math.random() * 1;
            const x = Math.cos(angle) * distance;
            const y = 0; // stays at this height
            const z = Math.sin(angle) * distance;
            particlesData.push(x, y, z);
        }
        accretionDisk.setAttribute('position', new THREE.Float32BufferAttribute(particlesData, 3));
        const accretionMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.15,
            transparent: true,
            opacity: 0.9
        });
        const accretionSystem = new THREE.Points(accretionDisk, accretionMaterial);
        scene.add(accretionSystem);
        
        // Create photon ring particles
        const photonRing = new THREE.BufferGeometry();
        const photonsData = [];
        for (let i = 0; i < 5000; i++) {
            const angle = Math.PI * 2 * (i / 4999);
            const radius = 10 + Math.random() * 2;
            const x = radius * Math.cos(angle);
            const z = radius * Math.sin(angle);
            const y = 0; // stays at this height
            photonsData.push(x, y, z);
        }
        photonRing.setAttribute('position', new THREE.Float32BufferAttribute(photonsData, 3));
        const photonMaterial = new THREE.PointsMaterial({
            color: 0xd5e6ff,
            size: 0.25,
            transparent: true,
            opacity: 0.8
        });
        const photonSystem = new THREE.Points(photonRing, photonMaterial);
        scene.add(photonSystem);
        
        // Create Event Horizon effect
        const eventHorizon = new THREE.SphereGeometry(3, 64, 64);
        const eventHorizonMaterial = new THREE.MeshBasicMaterial({
            color: 0x2d3b4f,
            transparent: true,
            opacity: 0.5
        });
        const eventHorizonMesh = new THREE.Mesh(eventHorizon, eventHorizonMaterial);
        scene.add(eventHorizonMesh);

        const glowGeometry = new THREE.SphereGeometry(4, 64, 64);
