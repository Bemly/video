<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Horizon: Black Hole Spectacle</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
        #ui { position: absolute; top: 10px; left: 10px; width: calc(100% - 20px); height: calc(100% - 20px); pointer-events: none; }
        h1 { font-family: 'Courier New', monospace; color: #fff; text-shadow: 0 0 10px #000; }
        p { font-family: 'Courier New', monospace; color: #aaa; text-shadow: 0 0 5px #000; }
    </style>
</head>
<body>
    <canvas></canvas>
    <div id="ui">
        <h1>Event Horizon</h1>
        <p>Gravitational Lensing & Accretion Disk Simulation</p>
    </div>
    <script>
        // Initialize WebGL and render loop.
        const canvas = document.querySelector('canvas');
        let gl = new WebGL(canvas);
        
        // Handle user interaction for rotation and zoom.
        canvas.addEventListener('mousemove', (e) => {
            gl.handleInput(e.clientX, e.clientY);
        });

        // Render the black hole and cosmic background.
        gl.render();
    </script>
</body>
