<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>黑洞视觉奇观</title>
<style>
  body{margin:0;overflow:hidden;background:#000;}
  canvas{display:block;width:100vw;height:100vh;}
  #ui{
    position:absolute;top:20px;left:30px;color:#fff;
    font-family:'Arial',sans-serif;font-size:1.2rem;pointer-events:none;
  }
  #ui h1{margin:0;font-size:2.5rem;}
</style>
</head>
<body>
<canvas id="glCanvas"></canvas>
<div id="ui"><h1>黑洞视觉奇观</h1></div>

<script>
/* ------------------ glMatrix (minimal subset) ------------------ */
var mat4 = {
  translate:function(o,a,v){for(let i=0;i<16;i++)o[i]=a[i];o[12]=a[0]*v[0]+a[4]*v[1]+a[8]*v[2]+a[12];o[13]=a[1]*v[0]+a[5]*v[1]+a[9]*v[2]+a[13];o[14]=a[2]*v[0]+a[6]*v[1]+a[10]*v[2]+a[14];o[15]=a[3]*v[0]+a[7]*v[1]+a[11]*v[2]+a[15];return o;},
  create:function(){return new Float32Array(16).fill(0).map((v,i)=>i%5?0:1);},
  perspective:function(out,fovy,aspect,near,far){
    var f=1/Math.tan(fovy/2), nf=1/(near-far);
    out[0]=f/aspect;out[1]=0;out[2]=0;out[3]=0;
    out[4]=0;out[5]=f;out[6]=0;out[7]=0;
    out[8]=0;out[9]=0;out[10]=(far+near)*nf;out[11]=-1;
    out[14]=2*far*near*nf;out[15]=0;return out;
  },
  lookAt:function(out,eye,center,up){
    var x0,x1,x2,y0,y1,y2,z0,z1,z2,len,
      eyex=eye[0],eyey=eye[1],eyez=eye[2],
      upx=up[0],upy=up[1],upz=up[2],
      centerx=center[0],centery=center[1],centerz=center[2];
    if(Math.abs(eyex-centerx)<0.000001&&Math.abs(eyey-centery)<0.000001&&Math.abs(eyez-centerz)<0.000001){
      return this.identity(out);
    }
    z0=eyex-centerx;z1=eyey-centery;z2=eyez-centerz;
    len=Math.hypot(z0,z1,z2);z0/=len;z1/=len;z2/=len;
    x0=upy*z2-upz*z1;x1=upz*z0-upx*z2;x2=upx*z1-upy*z0;
    len=Math.hypot(x0,x1,x2);x0/=len;x1/=len;x2/=len;
    y0=z1*x2-z2*x1;y1=z2*x0-z0*x2;y2=z0*x1-z1*x0;
    len=Math.hypot(y0,y1,y2);y0/=len;y1/=len;y2/=len;
    out[0]=x0;out[1]=y0;out[2]=z0;out[3]=0;
    out[4]=x1;out[5]=y1;out[6]=z1;out[7]=0;
    out[8]=x2;out[9]=y2;out[10]=z2;out[11]=0;
    out[12]=- (x0*eyex+x1*eyey+x2*eyez);
    out[13]=- (y0*eyex+y1*eyey+y2*eyez);
    out[14]=- (z0*eyex+z1*eyey+z2*eyez);
    out[15]=1;return out;
  },
  multiply:function(out,a,b){
    var a00=a[0],a01=a[1],a02=a[2],a03=a[3],
        a10=a[4],a11=a[5],a12=a[6],a13=a[7],
        a20=a[8],a21=a[9],a22=a[10],a23=a[11],
        a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    var b00=b[0],b01=b[1],b02=b[2],b03=b[3],
        b10=b[4],b11=b[5],b12=b[6],b13=b[7],
        b20=b[8],b21=b[9],b22=b[10],b23=b[11],
        b30=b[12],b31=b[13],b32=b[14],b33=b[15];
    out[0]=a00*b00+a01*b10+a02*b20+a03*b30;
    out[1]=a00*b01+a01*b11+a02*b21+a03*b31;
    out[2]=a00*b02+a01*b12+a02*b22+a03*b32;
    out[3]=a00*b03+a01*b13+a02*b23+a03*b33;
    out[4]=a10*b00+a11*b10+a12*b20+a13*b30;
    out[5]=a10*b01+a11*b11+a12*b21+a13*b31;
    out[6]=a10*b02+a11*b12+a12*b22+a13*b32;
    out[7]=a10*b03+a11*b13+a12*b23+a13*b33;
    out[8]=a20*b00+a21*b10+a22*b20+a23*b30;
    out[9]=a20*b01+a21*b11+a22*b21+a23*b31;
    out[10]=a20*b02+a21*b12+a22*b22+a23*b32;
    out[11]=a20*b03+a21*b13+a22*b23+a23*b33;
    out[12]=a30*b00+a31*b10+a32*b20+a33*b30;
    out[13]=a30*b01+a31*b11+a32*b21+a33*b31;
    out[14]=a30*b02+a31*b12+a32*b22+a33*b32;
    out[15]=a30*b03+a31*b13+a32*b23+a33*b33;
    return out;
  },
  rotateY:function(out,a,rad){
    var s=Math.sin(rad),c=Math.cos(rad),
        a00=a[0],a01=a[1],a02=a[2],a03=a[3],
        a10=a[4],a11=a[5],a12=a[6],a13=a[7],
        a20=a[8],a21=a[9],a22=a[10],a23=a[11],
        a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    out[0]=c*a00+s*a20;
    out[1]=c*a01+s*a21;
    out[2]=c*a02+s*a22;
    out[3]=c*a03+s*a23;
    out[4]=-s*a00+c*a20;
    out[5]=-s*a01+c*a21;
    out[6]=-s*a02+c*a22;
    out[7]=-s*a03+c*a23;
    out[8]=a20;
    out[9]=a21;
    out[10]=a22;
    out[11]=a23;
    out[12]=a30;
    out[13]=a31;
    out[14]=a32;
    out[15]=a33;
    return out;
  },
  rotateX:function(out,a,rad){
    var s=Math.sin(rad),c=Math.cos(rad),
        a00=a[0],a01=a[1],a02=a[2],a03=a[3],
        a10=a[4],a11=a[5],a12=a[6],a13=a[7],
        a20=a[8],a21=a[9],a22=a[10],a23=a[11],
        a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    out[0]=a00;
    out[1]=a01;
    out[2]=a02;
    out[3]=a03;
    out[4]=c*a10-s*a20;
    out[5]=c*a11-s*a21;
    out[6]=c*a12-s*a22;
    out[7]=c*a13-s*a23;
    out[8]=s*a10+c*a20;
    out[9]=s*a11+c*a21;
    out[10]=s*a12+c*a22;
    out[11]=s*a13+c*a23;
    out[12]=a30;
    out[13]=a31;
    out[14]=a32;
    out[15]=a33;
    return out;
  },
  identity:function(out){
    out[0]=1;out[1]=0;out[2]=0;out[3]=0;
    out[4]=0;out[5]=1;out[6]=0;out[7]=0;
    out[8]=0;out[9]=0;out[10]=1;out[11]=0;
    out[12]=0;out[13]=0;out[14]=0;out[15]=1;
    return out;
  }
};
/* -------------------------------------------------------------- */

/* ------------------ Shader Sources ---------------------------- */
const vsSrc = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPosition;
layout(location=1) in vec3 aNormal;
uniform mat4 uModel;
uniform mat4 uView;
uniform mat4 uProj;
out vec3 vNormal;
out vec3 vPos;
out vec2 vTexCoord;
void main(){
  vTexCoord = aPosition.xy*0.5+0.5;
  vec4 world = uModel * vec4(aPosition,1.0);
  vPos = world.xyz;
  vNormal = mat3(uModel) * aNormal;
  gl_Position = uProj * uView * world;
}
`;

const fsSrcSphere = `#version 300 es
precision highp float;
in vec3 vNormal;
in vec3 vPos;
uniform vec3 uLightDir;
out vec4 fragColor;
void main(){
  vec3 N = normalize(vNormal);
  float diff = max(dot(N,uLightDir),0.0);
  vec3 col = mix(vec3(0.1,0.05,0.02),vec3(0.6,0.4,0.2),diff);
  fragColor = vec4(col,1.0);
}
`;

const fsSrcDisk = `#version 300 es
precision highp float;
in vec3 vPos;
uniform float uTime;
out vec4 fragColor;
void main(){
  float r = length(vPos.xz);
  if(r>1.0 || r<0.8) discard;
  float t = mod(uTime*2.0,1.0);
  vec3 col = mix(vec3(1.0,0.4,0.0),vec3(1.0,0.2,0.0),sin(r*10.0 + t));
  fragColor = vec4(col,1.0);
}
`;

const fsSrcStar = `#version 300 es
precision highp float;
out vec4 fragColor;
void main(){
  fragColor = vec4(1.0);
}
`;

const fsSrcNebula = `#version 300 es
precision highp float;
in vec2 vTexCoord;
uniform sampler2D uTexture;
out vec4 fragColor;
void main(){
  vec3 col = texture(uTexture,vTexCoord).rgb * 0.2;
  fragColor = vec4(col,1.0);
}
`;

/* ------------------ Helper Functions -------------------------- */
function compileShader(gl,type,src){
  const s = gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}
function createProgram(gl,vs,fs){
  const p = gl.createProgram();
  gl.attachShader(p,vs);
  gl.attachShader(p,fs);
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(p));
  }
  return p;
}
function createBuffer(gl, data, attrLoc, size){
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(attrLoc);
  gl.vertexAttribPointer(attrLoc,size,gl.FLOAT,false,0,0);
  return buf;
}

/* ------------------ Geometry Generators ----------------------- */
function generateSphere(radius,latBands,longBands){
  const positions=[],normals=[],indices=[];
  for(let lat=0;lat<=latBands;++lat){
    const theta = lat*Math.PI/latBands;
    const sinTheta=Math.sin(theta),cosTheta=Math.cos(theta);
    for(let lon=0;lon<=longBands;++lon){
      const phi = lon*2*Math.PI/longBands;
      const sinPhi=Math.sin(phi),cosPhi=Math.cos(phi);
      const x=cosPhi*sinTheta,y=cosTheta,z=sinPhi*sinTheta;
      positions.push(radius*x,radius*y,radius*z);
      normals.push(x,y,z);
    }
  }
  for(let lat=0;lat<latBands;++lat){
    for(let lon=0;lon<longBands;++lon){
      const first = (lat* (longBands+1)) + lon;
      const second = first + longBands + 1;
      indices.push(first,second,first+1);
      indices.push(second,second+1,first+1);
    }
  }
  return {positions,normals,indices};
}
function generateRing(innerR,outerR,sides){
  const positions=[],normals=[],indices=[];
  for(let i=0;i<=sides;++i){
    const t = i/sides*2*Math.PI;
    const cosT=Math.cos(t),sinT=Math.sin(t);
    // inner
    positions.push(innerR*cosT,0,innerR*sinT);
    normals.push(0,1,0);
    // outer
    positions.push(outerR*cosT,0,outerR*sinT);
    normals.push(0,1,0);
  }
  for(let i=0;i<sides;++i){
    const a = i*2;
    indices.push(a,a+1,a+3);
    indices.push(a,a+3,a+2);
  }
  return {positions,normals,indices};
}
function generateTorus(R,r,sides,sectors){
  const positions=[],normals=[],indices=[];
  for(let i=0;i<=sides;++i){
    const theta=i/sides*2*Math.PI;
    const cosTheta=Math.cos(theta),sinTheta=Math.sin(theta);
    for(let j=0;j<=sectors;++j){
      const phi=j/sectors*2*Math.PI;
      const cosPhi=Math.cos(phi),sinPhi=Math.sin(phi);
      const x=(R+ r*cosPhi)*cosTheta;
      const y=r*sinPhi;
      const z=(R+ r*cosPhi)*sinTheta;
      positions.push(x,y,z);
      // normal
      const nx=cosPhi*cosTheta,ny=sinPhi,nz=cosPhi*sinTheta;
      normals.push(nx,ny,nz);
    }
  }
  for(let i=0;i<sides;++i){
    const a=i*(sectors+1);
    for(let j=0;j<sectors;++j){
      const b=a+j;
      indices.push(b,b+1,b+sectors+2);
      indices.push(b,b+sectors+2,b+sectors+1);
    }
  }
  return {positions,normals,indices};
}
function generateStars(count){
  const positions=[],colors=[];
  for(let i=0;i<count;++i){
    const theta = Math.random()*2*Math.PI;
    const phi = Math.acos(2*Math.random()-1);
    const r = 200 + Math.random()*300;
    const x=r*Math.sin(phi)*Math.cos(theta);
    const y=r*Math.sin(phi)*Math.sin(theta);
    const z=r*Math.cos(phi);
    positions.push(x,y,z);
    // random color slight blue/white
    const c = 0.8 + Math.random()*0.2;
    colors.push(c,c,1);
  }
  return {positions,colors};
}

/* ------------------ Texture Generation ------------------------ */
function createNebulaTexture(){
  const size=512;
  const canvas=document.createElement('canvas');
  canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');
  const grd=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size);
  grd.addColorStop(0,'#000022');
  grd.addColorStop(1,'#001122');
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,size,size);
  // add some dust
  for(let i=0;i<2000;++i){
    const x=Math.random()*size;
    const y=Math.random()*size;
    const r=Math.random()*3+1;
    ctx.fillStyle='rgba(255,255,255,'+(Math.random()*0.05)+')';
    ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fill();
  }
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB8,size,size,0,gl.RGB,gl.UNSIGNED_BYTE,canvas);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  return tex;
}

/* ------------------ Main -------------------------------------- */
const canvas=document.getElementById('glCanvas');
const gl=canvas.getContext('webgl2',{alpha:false});
if(!gl){alert('WebGL2 not supported');}

let width=canvas.clientWidth, height=canvas.clientHeight;
function resize(){
  width=canvas.clientWidth;height=canvas.clientHeight;
  canvas.width=width;canvas.height=height;
  gl.viewport(0,0,width,height);
}
window.addEventListener('resize',resize);
resize();

/* Compile Programs */
const vs=compileShader(gl,gl.VERTEX_SHADER,vsSrc);
const fsSphere=compileShader(gl,gl.FRAGMENT_SHADER,fsSrcSphere);
const programSphere=createProgram(gl,vs,fsSphere);
const fsDisk=compileShader(gl,gl.FRAGMENT_SHADER,fsSrcDisk);
const programDisk=createProgram(gl,vs,fsDisk);
const fsStar=compileShader(gl,gl.FRAGMENT_SHADER,fsSrcStar);
const programStar=createProgram(gl,vs,fsStar);
const fsNebula=compileShader(gl,gl.FRAGMENT_SHADER,fsSrcNebula);
const programNebula=createProgram(gl,vs,fsNebula);

/* Sphere (event horizon) */
const sphere = generateSphere(1,30,60);
const vboSpherePos=createBuffer(gl,sphere.positions,0,3);
const vboSphereNor=createBuffer(gl,sphere.normals,1,3);
const iboSphere=gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iboSphere);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(sphere.indices),gl.STATIC_DRAW);

/* Disk (accretion) */
const disk = generateRing(0.9,1.2,200);
const vboDiskPos=createBuffer(gl,disk.positions,0,3);
const vboDiskNor=createBuffer(gl,disk.normals,1,3);
const iboDisk=gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iboDisk);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(disk.indices),gl.STATIC_DRAW);

/* Torus (photon ring) */
const torus = generateTorus(1.0,0.02,60,30);
const vboTorusPos=createBuffer(gl,torus.positions,0,3);
const vboTorusNor=createBuffer(gl,torus.normals,1,3);
const iboTorus=gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iboTorus);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(torus.indices),gl.STATIC_DRAW);

/* Stars */
const stars = generateStars(5000);
const vboStarPos=createBuffer(gl,stars.positions,0,3);
const vboStarCol=createBuffer(gl,stars.colors,1,3);
const iboStars=gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iboStars);
const starIndices=new Uint16Array(stars.positions.length/3);
for(let i=0;i<starIndices.length;++i) starIndices[i]=i;
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,starIndices,gl.STATIC_DRAW);

/* Nebula */
const nebulaTexture=createNebulaTexture();
const vboNebPos=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,vboNebPos);
const nebVerts=[-100,-100,0, 100,-100,0, -100,100,0, 100,100,0];
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(nebVerts),gl.STATIC_DRAW);
const vboNebTex=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,vboNebTex);
const nebTex=[0,0,1,0,0,1,1,1];
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(nebTex),gl.STATIC_DRAW);

/* Uniform locations */
const uModelSphere=gl.getUniformLocation(programSphere,'uModel');
const uViewSphere=gl.getUniformLocation(programSphere,'uView');
const uProjSphere=gl.getUniformLocation(programSphere,'uProj');
const uLightDirSphere=gl.getUniformLocation(programSphere,'uLightDir');

const uModelDisk=gl.getUniformLocation(programDisk,'uModel');
const uViewDisk=gl.getUniformLocation(programDisk,'uView');
const uProjDisk=gl.getUniformLocation(programDisk,'uProj');
const uTimeDisk=gl.getUniformLocation(programDisk,'uTime');

const uModelTorus=gl.getUniformLocation(programTorus=programSphere,'uModel');
const uViewTorus=gl.getUniformLocation(programTorus,'uView');
const uProjTorus=gl.getUniformLocation(programTorus,'uProj');

const uModelStar=gl.getUniformLocation(programStar,'uModel');
const uViewStar=gl.getUniformLocation(programStar,'uView');
const uProjStar=gl.getUniformLocation(programStar,'uProj');

const uModelNebula=gl.getUniformLocation(programNebula,'uModel');
const uViewNebula=gl.getUniformLocation(programNebula,'uView');
const uProjNebula=gl.getUniformLocation(programNebula,'uProj');

/* Camera & Controls */
let camDist=5,camRotX=Math.PI/2,camRotY=Math.PI/4;
let isDragging=false,lastX=0,lastY=0;

canvas.addEventListener('mousedown',e=>{
  isDragging=true;lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  camRotY+=dx*0.005;camRotX+=dy*0.005;
  camRotX=Math.max(0.01,Math.min(Math.PI-0.01,camRotX));
  lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener('mouseup',()=>{isDragging=false;});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  camDist*=1+e.deltaY*0.001;
  camDist=Math.max(2,Math.min(15,camDist));
});

/* Main Render Loop */
const proj=mat4.create();
mat4.perspective(proj,Math.PI/4,width/height,0.1,100);
let then=performance.now();

function render(now){
  now*=0.001;
  const dt=now-then;then=now;

  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);

  const view=mat4.create();
  const eye=[camDist*Math.sin(camRotX)*Math.cos(camRotY),
             camDist*Math.cos(camRotX),
             camDist*Math.sin(camRotX)*Math.sin(camRotY)];
  const center=[0,0,0];
  const up=[0,1,0];
  mat4.lookAt(view,eye,center,up);

  /* Nebula */
  gl.useProgram(programNebula);
  const modelNeb=mat4.create(); mat4.translate(modelNeb,modelNeb,[0,0,-300]); // far behind
  gl.uniformMatrix4fv(uModelNebula,false,modelNeb);
  gl.uniformMatrix4fv(uViewNebula,false,view);
  gl.uniformMatrix4fv(uProjNebula,false,proj);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,nebulaTexture);
  gl.uniform1i(gl.getUniformLocation(programNebula,'uTexture'),0);
  gl.bindBuffer(gl.ARRAY_BUFFER,vboNebPos);gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,vboNebTex);gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  /* Stars */
  gl.useProgram(programStar);
  const modelStar=mat4.create();
  gl.uniformMatrix4fv(uModelStar,false,modelStar);
  gl.uniformMatrix4fv(uViewStar,false,view);
  gl.uniformMatrix4fv(uProjStar,false,proj);
  gl.bindBuffer(gl.ARRAY_BUFFER,vboStarPos);gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,vboStarCol);gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
  gl.drawElements(gl.POINTS,starIndices.length,gl.UNSIGNED_SHORT,0);

  /* Sphere */
  gl.useProgram(programSphere);
  const modelSphere=mat4.create();
  mat4.rotateY(modelSphere,modelSphere,now*0.1);
  gl.uniformMatrix4fv(uModelSphere,false,modelSphere);
  gl.uniformMatrix4fv(uViewSphere,false,view);
  gl.uniformMatrix4fv(uProjSphere,false,proj);
  gl.uniform3f(uLightDirSphere,0.5,-1,0.5);
  gl.bindBuffer(gl.ARRAY_BUFFER,vboSpherePos);gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,vboSphereNor);gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iboSphere);
  gl.drawElements(gl.TRIANGLES,sphere.indices.length,gl.UNSIGNED_SHORT,0);

  /* Disk */
  gl.useProgram(programDisk);
  const modelDisk=mat4.create();
  mat4.rotateY(modelDisk,modelDisk,-now*1.5);
  gl.uniformMatrix4fv(uModelDisk,false,modelDisk);
  gl.uniformMatrix4fv(uViewDisk,false,view);
  gl.uniformMatrix4fv(uProjDisk,false,proj);
  gl.uniform1f(uTimeDisk,now);
  gl.bindBuffer(gl.ARRAY_BUFFER,vboDiskPos);gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,vboDiskNor);gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iboDisk);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE); // additive
  gl.drawElements(gl.TRIANGLES,disk.indices.length,gl.UNSIGNED_SHORT,0);
  gl.disable(gl.BLEND);

  /* Torus */
  gl.useProgram(programTorus); // we reused sphere program for torus
  const modelTorus=mat4.create();
  mat4.rotateY(modelTorus,modelTorus,-now*0.5);
  gl.uniformMatrix4fv(uModelTorus,false,modelTorus);
  gl.uniformMatrix4fv(uViewTorus,false,view);
  gl.uniformMatrix4fv(uProjTorus,false,proj);
  gl.bindBuffer(gl.ARRAY_BUFFER,vboTorusPos);gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,vboTorusNor);gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iboTorus);
  gl.drawElements(gl.TRIANGLES,torus.indices.length,gl.UNSIGNED_SHORT,0);

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* Point size for stars */
gl.enable(gl.POINT_SPRITE); // if supported
gl.vertexAttrib1f(gl.getAttribLocation(programStar,'aPointSize'),5);
