<!DOCTYPE html><html lang="en"><head>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three/examples/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/"}}</script>
<meta charset="UTF-8"><title>Arctic Black Hole</title><style>*{margin:0;padding:0;box-sizing:border-box;background:#000;color:#fff;font-family:sans-serif}body{overflow:hidden;height:100vh;width:100vw;display:flex;justify-content:center;align-items:center}canvas{display:block}</style></head><body><canvas id=c></canvas><div class=ui><h1>Arctic Black Hole</h1><p>Data visualization powered by WebGL and Three.js</p></div><script type="module">import * as THREE from"https://cdn.jsdelivr.net/npm/three@0.162/build/three.module.js";const canvas=document.getElementById('c');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,2000);camera.position.set(0,0,1000);function createAccretionDisc(){const geometry=new THREE.RingGeometry(5,15,.1);const material=new THREE.MeshBasicMaterial({color:0x00ffff,alphaTest:0.2,transparent:true});const disc= new THREE.Mesh(geometry,material);disc.rotation.x=Math.PI/2;scene.add(disc)}function createPhotonSphere(){const radius=20;for(let i=0;i<300;i++){const p=new THREE.Vector3();p.setFromSphericalCoords(radius*1.05,Math.random()*Math.PI*2,Math.acos(1-2*Math.random()));const geom=new THREE.SphereGeometry(0.02,12,8);const mat=new THREE.MeshBasicMaterial({color:0xffffff,alphaTest:0});const s=new THREE.Mesh(geom,mat);s.position.copy(p);scene.add(s)}}function createEventHorizon(){const radius=100;for(let i=0;i<500;i++){const p=new THREE.Vector3();p.setFromSphericalCoords(radius*Math.random(),Math.random()*Math.PI*2,Math.acos(Math.random()-0.5));const geom=new THREE.SphereGeometry(0.1,16,12);const mat=new THREE.MeshBasicMaterial({color:0x00ff00,alphaTest:0});const s=new THREE.Mesh(geom,mat);s.position.copy(p);scene.add(s)}}function createSpaghettification(){// Simple tube for illustrationconst geo=new THREE.CylinderGeometry(1,1,300,64);geo.rotateX(Math.PI/2);geo.translate(0,-150,0);const mat=new THREE.MeshBasicMaterial({color:0xffd700});const mesh=new THREE.Mesh(geo,mat);scene.add(mesh)}function createBackground(){// Stars with movementconst starCount=20000;for(let i=0;i<starCount;i++){const size=Math.random()*2+1;const color= new THREE.Color(Math.random(),Math.random(),Math.random());const geom=new THREE.SphereGeometry(size,8,6);const mat=new THREE.MeshBasicMaterial({color});const mesh=new THREE.Mesh(geom,mat);mesh.position.set(Math.random()*(window.innerWidth/5)*2-(window.innerWidth/10),Math.random()*window.innerHeight*0.8-(-window.innerHeight/4),Math.random()*(window.innerHeight/5)*2-(window.innerHeight/10));scene.add(mesh)}}function update(){requestAnimationFrame(update);renderer.render(scene,camera)}createAccretionDisc();createPhotonSphere();createEventHorizon();createSpaghettification();createBackground();renderer.setSize(window.innerWidth,window.innerHeight);window.addEventListener('resize',()=>{const w=window.innerWidth,h=window.innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)});setInterval(()=>{for(let i=0;i<scene.children.length;i++){if(scene.children[i].isMesh){scene.children[i].position.x=(scene.children[i].position.x+Math.random()*0.01)*0.99}}},10);update();</script></body></html>
