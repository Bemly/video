<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kelvora · 必胜之道</title>
<style>
  html,body{margin:0;height:100%;background:#f1eee6;overflow:hidden;color:#353830;font:14px "PingFang SC",system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  #top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px 4px}
  #top b{letter-spacing:.1em}#status{color:#85877a}#top a{color:#9b8563;text-decoration:none}
  #note{color:#85877a;font-size:12px}
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #c{max-width:100vw;max-height:100%;aspect-ratio:16/9;width:auto;height:auto;cursor:pointer;background:#f1eee6}
  #ui{padding:10px 16px 14px;background:linear-gradient(transparent,rgba(241,238,230,.95));transition:opacity .4s}
  #ui.playing{opacity:0}#ui.playing:hover{opacity:1}
  #row{display:flex;align-items:center;gap:12px}
  button{background:none;border:1px solid #9b8563;color:#6b5f45;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
  button:disabled{opacity:.35;cursor:default}
  #bar{flex:1;height:6px;background:#d8d4c6;border-radius:3px;cursor:pointer;position:relative}#fill{height:100%;width:0;background:#9b8563;border-radius:3px}
  .tick{position:absolute;top:-3px;width:2px;height:12px;background:#b8b4a4}
  #time{font-variant-numeric:tabular-nums;color:#85877a;min-width:112px;text-align:right}
</style>
</head>
<body>
<div id="wrap">
<div id="top"><b>kelvora · 必胜之道</b><span id="status">加载中…</span><span id="note">空格播放/暂停，←/→ 3 秒，R 重播</span><a href="../">← 返回</a></div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ui"><div id="row"><button id="play" disabled>▶</button><div id="bar"><div id="fill"></div></div><span id="time">0:00</span><button id="fs">⛶</button></div></div>
</div>
<audio id="au" src="audio/mix.mp3" preload="auto"></audio>
<script src="fonts.js"></script>
<script src="engine.js"></script>
<script src="glyphs.js"></script>
<script src="games.js"></script>
<script src="scenes.js"></script>
<script src="timeline.js"></script>
<script>
(async () => {
  const _qs = new URLSearchParams(location.search);
  const _isHeadless = _qs.has('render') || _qs.has('headless');
  const _isCover = _qs.has('cover');
  const load = async (b64, style) => { const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); const f = new FontFace('Cormorant', bin.buffer, { style, weight: '400' }); await f.load(); document.fonts.add(f); };
  try { await load(FONTS.reg, 'normal'); await load(FONTS.ita, 'italic'); } catch (e) { console.warn('font load failed', e); }
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'main.js'; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  await new Promise((res) => { if (window.ready) res(); else { const iv = setInterval(() => { if (window.ready) { clearInterval(iv); res(); } }, 20); } });

  const cv = document.getElementById('c');
  const statusEl = document.getElementById('status');
  const playBtn = document.getElementById('play');
  const bar = document.getElementById('bar');
  const fill = document.getElementById('fill');
  const timeEl = document.getElementById('time');
  const au = document.getElementById('au');
  const DUR = window.TIMELINE.duration;
  const FPS = window.TIMELINE.fps;
  const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  timeEl.textContent = `0:00 / ${fmt(DUR)}`;

  // scene-change ticks on progress bar
  for (const sc of window.TIMELINE.scenes.slice(1)) {
    const t = document.createElement('div');
    t.className = 'tick'; t.style.left = `${(sc.start / DUR) * 100}%`; bar.appendChild(t);
  }

  // ?t= single-frame mode (QA): main.js already rendered it, just show time
  if (_qs.has('t') && !_qs.has('play')) {
    const t = +_qs.get('t');
    fill.style.width = `${(t / DUR) * 100}%`;
    timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
    statusEl.textContent = '';
    return;
  }
  // cover / headless / render pipeline: leave canvas to record.mjs
  if (_isHeadless || _isCover) { statusEl.textContent = ''; return; }
  // legacy ?play (silent preview): keep main.js behavior, hide audio UI
  if (_qs.has('play')) { statusEl.textContent = '静音预览'; playBtn.disabled = true; return; }

  // ---- audio-clocked playback ----
  let cur = 0;
  try { window.renderFrame(0); cur = 0; } catch (e) { console.error(e); }
  let readyAudio = false;
  const setPlaying = (p) => {
    playBtn.textContent = p ? '⏸' : '▶';
    document.getElementById('ui').classList.toggle('playing', p);
  };
  const show = () => {
    const t = au.currentTime || 0;
    const target = Math.min(window.totalFrames - 1, Math.floor(t * FPS));
    // advance sequentially (games are simulations; seeking back resets inside renderFrame)
    let guard = 0;
    while (cur < target && guard++ < 120) { window.renderFrame(cur + 1); cur++; }
    if (target < cur) { window.renderFrame(target); cur = target; }
    fill.style.width = `${(t / DUR) * 100}%`;
    timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
  };
  au.addEventListener('canplay', () => { if (!readyAudio) { readyAudio = true; playBtn.disabled = false; statusEl.textContent = ''; } }, { once: true });
  au.addEventListener('error', () => { statusEl.textContent = '音频加载失败（audio/mix.mp3）'; }, { once: true });
  // in case canplay already fired
  if (au.readyState >= 3) { readyAudio = true; playBtn.disabled = false; statusEl.textContent = ''; }
  au.addEventListener('play', () => setPlaying(true));
  au.addEventListener('pause', () => setPlaying(false));
  au.addEventListener('ended', () => setPlaying(false));
  const toggle = () => { if (!readyAudio) return; au.paused ? au.play() : au.pause(); };
  cv.addEventListener('click', toggle);
  playBtn.addEventListener('click', toggle);
  const seekTo = (clientX) => {
    const r = bar.getBoundingClientRect();
    au.currentTime = Math.min(1, Math.max(0, (clientX - r.left) / r.width)) * DUR;
    show();
  };
  bar.addEventListener('pointerdown', (e) => {
    if (!readyAudio) return;
    bar.setPointerCapture(e.pointerId);
    seekTo(e.clientX);
    const move = (ev) => seekTo(ev.clientX);
    const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
  });
  document.getElementById('fs').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight') { if (readyAudio) { au.currentTime = Math.min(DUR, au.currentTime + 3); show(); } }
    else if (e.code === 'ArrowLeft') { if (readyAudio) { au.currentTime = Math.max(0, au.currentTime - 3); show(); } }
    else if (e.key === 'r' || e.key === 'R') { if (readyAudio) { au.currentTime = 0; au.play(); } }
  });
  const loop = () => { if (!au.paused && !au.ended) show(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  // timeout fallback: enable play even if canplay is slow
  setTimeout(() => { if (!readyAudio) { playBtn.disabled = false; statusEl.textContent = '点击播放（音频仍在加载）'; readyAudio = true; } }, 4000);
})();
</script>
</body>
</html>
