<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>叠界 · 讲解视频（Code Odyssey）</title>
<style>
html,body{margin:0;height:100%;background:#0c0a10;color:#F5EAD5;font:14px "PingFang SC",system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;inset:0 0 64px 0;margin:auto;display:block;max-width:100vw;max-height:calc(100vh - 64px);aspect-ratio:16/9;width:auto;height:auto;background:#000}
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.8));transition:opacity .4s}
#ui.playing{opacity:0}#ui.playing:hover{opacity:1}
#row{display:flex;align-items:center;gap:12px}
button{background:none;border:1px solid #ff29b8;color:#ff8fd0;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
#bar{flex:1;height:6px;background:#333;border-radius:3px;cursor:pointer;position:relative}#fill{height:100%;width:0;background:#ff29b8;border-radius:3px}
#time{font-variant-numeric:tabular-nums;color:#8C877C;min-width:112px;text-align:right}
#top{position:fixed;left:16px;top:12px;right:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
#status{color:#8C877C}#top a{color:#5CC7C0;text-decoration:none}#top b{letter-spacing:.1em}
#note{color:#8C877C;font-size:12px}
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }</script>
</head><body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div id="top"><b>叠界 · Code Odyssey</b><span id="status">首帧渲染中，稍候…</span><span id="note">15:21 · 浏览器实时渲染 · 中英双语字幕 · 空格播放/暂停，←/→ 逐秒</span><a href="../">← 返回</a><a href="../odyssey/">可玩 demo →</a></div>
<div id="ui"><div id="row"><button id="play" disabled>▶</button><div id="bar"><div id="fill"></div></div><span id="time">0:00</span><button id="fs">⛶</button></div></div>
<script type="module" src="./player.js"></script>
</body></html>
